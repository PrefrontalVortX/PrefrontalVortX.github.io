# Site Configuration
title: PrefrontalVortX
description: >-
  Personal website and portfolio
url: "https://prefrontalvortx.github.io"
baseurl: ""

# Build settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Site metadata
author:
  name: PrefrontalVortX
  email: ""

# Social media
social:
  github: PrefrontalVortX

# Pagination
paginate: 10
paginate_path: "/blog/page:num"

# Markdown settings
markdown: kramdown
kramdown:
  parse_block_html: true

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:day/:slug/

# Exclude from processing
exclude:
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock
  - .sass-cache
  - .jekyll-cache
  - vendor

# Include in processing
include:
  - _redirects

# Permalink structure
permalink: /:categories/:year/:month/:day/:title/

# Future posts
future: false

# Build settings
keep_files:
  - .well-known

# Analytics (uncomment and configure as needed)
# google_analytics: UA-XXXXXXXXX-X
